<!doctype html>
<html lang="zh-CN" data-tai-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAi Browser · 光庭 Atrium</title>
<link rel="stylesheet" href="tokens.css">
<style>
:root{color-scheme:light;--ink:var(--tai-ink);--muted:var(--tai-ink-muted);--mist:var(--tai-canvas);--line:var(--tai-line)}
*{box-sizing:border-box}body{margin:0;background:var(--mist);color:var(--ink);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1060px;margin:7vh auto;padding:clamp(24px,6vw,72px);background:#fff;border:1px solid var(--line);border-radius:24px}small{color:var(--muted);letter-spacing:.16em}h1{font-size:clamp(38px,7vw,76px);line-height:1.1;letter-spacing:-.04em;margin:24px 0}p{max-width:660px;color:var(--muted)}.hero{margin:36px 0;aspect-ratio:740/348;border-radius:20px;background:url('standard-hero.png') center / cover no-repeat}.rules{display:flex;gap:20px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line)}.rules span{color:var(--muted)}footer{font-size:12px;color:var(--muted);margin-top:34px}
</style><main><small>TAi BROWSER · ATRIUM</small><h1>为思考留出空间。</h1><p>光庭 · Atrium<br>移步换景，自然光影。宽敞的留白，清楚的层次。</p><div class="hero" role="img" aria-label="用户选定的建筑主视觉：柔和光线穿过圆形开口，映照白色墙面和水面"></div><div class="rules"><span>留白</span><span>采光</span><span>层次</span><span>流动</span></div><footer>已选视觉参考。建筑画面直接取自原概念图；本页不是浏览器运行截图。</footer></main></html>
